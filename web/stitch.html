<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>터치라인 — 기록 잇기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script defer src="core.js"></script>
<script defer src="stitch.js"></script>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand"><strong>터치라인</strong><span>기록 잇기</span></div>
    <nav class="tabs"><a id="linkWatch" class="tab" href="watch.html">복기 화면</a></nav>
  </header>
  <div class="steps"><a href="index.html">영상 목록</a><span>·</span><span>끊기거나 다른 선수로 넘어간 기록을 이어서 한 선수의 기록으로 만듭니다</span></div>
  <p id="loadError" class="load-error" role="alert" hidden></p>

  <div class="stitch-grid">
    <section class="card" aria-label="확대 화면">
      <div class="card-head"><h2 id="zoomTitle">확대 화면</h2><span>박스를 누르면 그 선수를 고릅니다</span></div>
      <div class="follow-wrap"><canvas id="zoom" width="960" height="540" aria-label="확대 화면. 박스를 눌러 선택"></canvas><p id="zoomMsg" class="follow-msg" hidden></p></div>
      <div class="controls">
        <button type="button" id="playBtn" class="btn dark">재생</button>
        <select id="rate" aria-label="재생 속도"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
        <span id="clock" class="clock">0:00 / 0:00</span>
        <div id="timeline" class="timeline" role="slider" aria-label="재생 위치" tabindex="0"><div id="tlSegments"></div><div id="tlMarks"></div><div id="tlHead" class="tl-head"></div></div>
      </div>
      <div class="legend"><span><i class="lg seg"></i>내 기록</span><span><i class="lg run"></i>다른 선수와 겹친 곳</span><span>빈 곳: 아직 잇지 않은 구간</span></div>
    </section>

    <aside class="stitch-side">
      <section class="card" aria-label="지금 할 일">
        <div class="card-head"><h2>지금 할 일</h2></div>
        <p id="todo" class="todo-text"></p>
        <div id="confirm" class="confirm" hidden>
          <p id="confirmText"></p>
          <div class="row"><button type="button" id="yesBtn" class="btn green">맞아요</button><button type="button" id="noBtn" class="btn">아니에요</button></div>
        </div>
        <div id="cands" class="row"></div>
        <div class="row">
          <button type="button" id="cutBtn" class="btn" disabled>여기서부터 내가 아니에요</button>
          <button type="button" id="undoBtn" class="btn" disabled>되돌리기</button>
        </div>
      </section>
      <section class="card" aria-label="확인할 곳">
        <div class="card-head"><h2>확인할 곳</h2><span id="crossCount"></span></div>
        <p class="note">다른 선수와 겹친 뒤에도 주황색 박스가 나를 따라가는지 봐 주세요.</p>
        <div class="row"><button type="button" id="prevCross" class="btn" disabled>이전</button><button type="button" id="nextCross" class="btn" disabled>다음</button></div>
      </section>
      <section class="card" aria-label="내 기록">
        <div class="card-head"><h2>내 기록</h2><span id="chainInfo"></span></div>
        <ol id="partList" class="part-list"></ol>
        <label class="field">이름<input type="text" id="name" maxlength="20" value="나"></label>
        <div class="row"><button type="button" id="saveBtn" class="btn green" disabled>저장</button><button type="button" id="resetBtn" class="btn" disabled>처음부터 다시</button></div>
        <p id="saveMsg" class="note" role="status"></p>
      </section>
    </aside>
  </div>

  <section class="card" aria-label="전체 영상">
    <div class="card-head"><h2>전체 영상</h2><span>여기서 눌러도 선수를 고를 수 있어요</span></div>
    <div class="video-wrap" id="videoWrap"><video id="video" muted playsinline preload="auto"></video><canvas id="overlay" aria-label="전체 영상의 선수 박스"></canvas></div>
  </section>
</div>
</body>
</html>
